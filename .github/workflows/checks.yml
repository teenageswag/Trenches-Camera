name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  settings-and-scripts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Settings and presets
        run: bash Trenches/scripts/test-settings.sh
      - name: Shell syntax
        run: |
          for script in Trenches/scripts/*.sh; do
            bash -n "$script"
          done
      - name: Python syntax
        run: python3 -m compileall -q Trenches/scripts
